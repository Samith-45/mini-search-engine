<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="sfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="sfGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <filter id="sfBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="128" height="128" rx="28" fill="url(#sfBg)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />

  <!-- Modern Search Lens -->
  <circle cx="56" cy="56" r="25" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
  
  <!-- Search Handle -->
  <line x1="74" y1="74" x2="98" y2="98" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />

  <!-- Core Forge Energy Star / Node -->
  <polygon points="56,38 61,51 74,56 61,61 56,74 51,61 38,56 51,51" fill="url(#sfGlow)" filter="url(#sfBlur)" />
</svg>
