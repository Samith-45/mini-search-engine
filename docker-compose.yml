version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: searchforge-postgres
    restart: always
    environment:
      POSTGRES_DB: searchforgedb
      POSTGRES_USER: searchforge
      POSTGRES_PASSWORD: searchforge_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchforge -d searchforgedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: searchforge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: searchforge-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/searchforgedb
      SPRING_DATASOURCE_USERNAME: searchforge
      SPRING_DATASOURCE_PASSWORD: searchforge_secret
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: searchforge-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8080/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
